name: release

# Publica una versión: valida el repositorio, construye imágenes (cuando
# existan) y crea el release con notas tomadas del CHANGELOG.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (ej. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_app: ${{ steps.detect.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Documentación
        run: node scripts/ci/check-docs.mjs
      - name: Secretos
        run: node scripts/ci/check-secrets.mjs
      - name: Compose
        run: docker compose config -q
      - name: Detectar aplicaciones
        id: detect
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Verificar CHANGELOG
        run: |
          if ! grep -q "## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md no tiene entrada para ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "CHANGELOG correcto para ${GITHUB_REF_NAME}"

  images:
    name: images
    needs: validate
    if: needs.validate.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Detectar Dockerfile
        id: detect
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      # ghcr.io exige nombres en minúsculas: github.repository conserva mayúsculas.
      - name: Calcular nombre de imagen
        id: image
        run: |
          PREFIX="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"
          echo "Imagen: ${PREFIX}/${{ matrix.service }}"

      - uses: docker/setup-buildx-action@v3
        if: steps.detect.outputs.present == 'true'

      - uses: docker/login-action@v3
        if: steps.detect.outputs.present == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El contexto es la raíz del monorepo: los Dockerfiles instalan el workspace.
      - uses: docker/build-push-action@v6
        if: steps.detect.outputs.present == 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/${{ matrix.service }}:${{ github.ref_name }}
            ${{ steps.image.outputs.prefix }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true

      - name: Aviso si no existe Dockerfile
        if: steps.detect.outputs.present != 'true'
        run: |
          echo "Sin Dockerfile para ${{ matrix.service }}: se omite (llega en una fase posterior)."
  release:
    name: release
    needs: [validate, images]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraer notas del CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\["v"\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Ver CHANGELOG.md" > release-notes.md; fi
          head -40 release-notes.md

      - name: Crear release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Hacienda Ganadera ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
