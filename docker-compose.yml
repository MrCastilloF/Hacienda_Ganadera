# ──────────────────────────────────────────────────────────────────────────────
#  Hacienda Ganadera — Docker Compose base
#
#  Fase 0: solo infraestructura.  Los servicios de aplicación (api, web,
#  lora-service, worker) están bajo el perfil "app" y se activan cuando el
#  código exista (Fase 1).
#
#    docker compose up -d                    # infraestructura
#    docker compose --profile app up -d      # plataforma completa (Fase 1+)
#    docker compose --profile lorawan up -d  # servidor LoRaWAN local
#    docker compose --profile tools run --rm backup   # respaldo manual
#
#  Reglas del proyecto:
#   - Sin `latest`: versiones fijas (y digest en producción).
#   - Nada de postgres/redis/minio expuesto a la LAN.
#   - Todo servicio con healthcheck, salvo los que no lo soportan (documentado).
# ──────────────────────────────────────────────────────────────────────────────
name: hacienda-ganadera

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:
  # ── Base de datos ───────────────────────────────────────────────────────────
  postgres:
    <<: *default-restart
    image: postgis/postgis:16-3.4
    container_name: hg-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hacienda}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-hacienda_owner}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-cambiar_en_produccion}
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8 --locale=C"
      TZ: ${TZ:-America/Bogota}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Solo accesible desde el host de desarrollo; nunca desde la LAN.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal
    logging: *default-logging
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f

  # ── Colas y caché ───────────────────────────────────────────────────────────
  redis:
    <<: *default-restart
    image: redis:7.4-alpine
    container_name: hg-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal
    logging: *default-logging

  # ── Documentos (S3 compatible) ──────────────────────────────────────────────
  minio:
    <<: *default-restart
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2023-09-04T19-57-37Z}
    # Fijar el digest en producción: minio/minio@sha256:...
    container_name: hg-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-cambiar_en_produccion}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    # minio/minio no incluye cliente HTTP en todas las versiones; el estado se
    # vigila desde el servicio api (/ready) en la Fase 1.
    networks:
      - internal
    logging: *default-logging

  # ── Proxy TLS (único punto expuesto) ────────────────────────────────────────
  proxy:
    <<: *default-restart
    image: caddy:2-alpine
    container_name: hg-proxy
    depends_on:
      - postgres
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@ejemplo.com}
      TLS_MODE: ${TLS_MODE:-internal}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - edge
      - internal
    logging: *default-logging

  # ── Aplicación ──────────────────────────────────────────────────────────────
  #  El worker de trabajos asíncronos llega en la Fase 11 y el servicio de
  #  ingesta LoRaWAN en la Fase 9: se agregan aquí cuando exista su código, no
  #  antes (un servicio que no puede construirse rompe `--profile app`).
  api:
    <<: *default-restart
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hg-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://app_rw:cambiar_en_produccion@postgres:5432/hacienda?schema=app}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-cambiar_en_produccion}
      JWT_ISSUER: ${JWT_ISSUER:-hacienda-ganadera}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-hacienda-web}
      # En producción no hay claves efímeras: se generan con
      # `node scripts/dev/generate-keys.mjs` y se montan como secretos.
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-America/Bogota}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
    volumes:
      - ./secrets:/run/secrets:ro
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal
    logging: *default-logging

  web:
    <<: *default-restart
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hg-web
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: /api/v1
      TZ: ${TZ:-America/Bogota}
    expose:
      - "3000"
    networks:
      - internal
    logging: *default-logging

  # ── LoRaWAN local (opcional) ────────────────────────────────────────────────
  mosquitto:
    <<: *default-restart
    profiles: ["lorawan"]
    image: eclipse-mosquitto:2.0
    container_name: hg-mosquitto
    volumes:
      - ./infra/chirpstack/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquittodata:/mosquitto/data
    expose:
      - "1883"
    networks:
      - internal
    logging: *default-logging

  chirpstack:
    <<: *default-restart
    profiles: ["lorawan"]
    image: chirpstack/chirpstack:4
    container_name: hg-chirpstack
    depends_on:
      mosquitto:
        condition: service_started
    environment:
      TZ: ${TZ:-America/Bogota}
    volumes:
      - ./infra/chirpstack/chirpstack.toml:/etc/chirpstack/chirpstack.toml:ro
    expose:
      - "8080"
    networks:
      - internal
    logging: *default-logging

  # ── Herramientas ────────────────────────────────────────────────────────────
  backup:
    profiles: ["tools"]
    image: postgres:16-alpine
    container_name: hg-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_SUPERUSER:-hacienda_owner}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-cambiar_en_produccion}
      PGDATABASE: ${POSTGRES_DB:-hacienda}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        apk add --no-cache tzdata >/dev/null 2>&1;
        pg_dump -Fc --no-owner --no-privileges -f /backups/hacienda-$(date +%Y%m%d-%H%M%S).dump &&
        find /backups -name 'hacienda-*.dump' -mtime +$${BACKUP_RETENTION_DAYS} -delete &&
        echo "respaldo completado"
    volumes:
      - ./backups:/backups
    networks:
      - internal
    logging: *default-logging

volumes:
  pgdata:
    name: hg-pgdata
  redisdata:
    name: hg-redisdata
  miniodata:
    name: hg-miniodata
  caddydata:
    name: hg-caddydata
  caddyconfig:
    name: hg-caddyconfig
  mosquittodata:
    name: hg-mosquitto

networks:
  edge:
    name: hg-edge
    driver: bridge
  internal:
    name: hg-internal
    driver: bridge
    internal: true
