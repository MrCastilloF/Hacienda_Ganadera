# ──────────────────────────────────────────────────────────────────────────────
#  Mosquitto — broker MQTT interno (perfil "lorawan")
#  Solo escucha en la red interna de Docker. Sin acceso anónimo desde el host.
# ──────────────────────────────────────────────────────────────────────────────

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# Persistencia
persistence true
persistence_location /mosquitto/data/

# Límites defensivos (evitan que un dispositivo defectuoso consuma el broker)
max_connections 200
max_queued_messages 5000
message_size_limit 8192

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
